<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto ROI Tracker | Record Your Gains</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <!-- Optional Header Content (e.g., navigation or title) -->
</header>

<main>

    <h2>ROI % Calculator</h2>

    <!-- Canvas for Bitcoin and Ethereum charts -->
    <div>
        <canvas id="btcChart"></canvas>
    </div>

    <br>

    <div>
        <canvas id="ethChart"></canvas>
    </div>

    <!-- Transaction history -->
    <div>
        <h2>Your current performance</h2>
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Bought</th>
                    <th>Sold</th>
                    <th>Remaining</th>
                    <th>Crypto</th>
                    <th>Buy Price ($)</th>
                    <th>Sell Price ($)</th>
                    <th>ROI%</th> <!-- Now dynamically calculated -->
                </tr>
            </thead>
            <tbody id="table_body">
                <!-- Placeholder rows -->
                <tr>
                    <td>01/01/2025</td>
                    <td>0.1 BTC</td>
                    <td>0.05 BTC</td>
                    <td>0.05 BTC</td>
                    <td>Bitcoin</td>
                    <td>$95,000</td>
                    <td>$100,000</td>
                    <td><!-- ROI will be calculated automatically --></td>
                </tr>
                <tr>
                    <td>02/01/2025</td>
                    <td>1 ETH</td>
                    <td>0.5 ETH</td>
                    <td>0.5 ETH</td>
                    <td>Ethereum</td>
                    <td>$2,350</td>
                    <td>$2,400</td>
                    <td><!-- ROI will be calculated automatically --></td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Transaction recorder -->
    <div>
        <h3>Record your trade</h3>
        <form id="transactionForm">
            <input type="date" id="inputDate" required>
            <input type="text" id="inputBought" placeholder="BUY" required>
            <input type="text" id="inputSold" placeholder="SELL" required>
            <input type="text" id="inputRemaining" placeholder="REMAINING" required>
            <select id="inputCrypto" required>
                <option value="BTC">BTC</option>
                <option value="ETH">ETH</option>
            </select>
            <input type="text" id="inputPriceAtTime" placeholder="Buy Price USD" required>
            <input type="text" id="inputSoldPrice" placeholder="Sell Price USD" required>            
            <button type="submit">Add Transaction</button>
        </form>
    </div>

    <!-- Projected ROI section -->
    <div>
        <h2>Your Projected ROI%</h2>
        <canvas id="roiChart"></canvas>
    </div>

</main> <!-- Corrected closing tag -->

<footer>
    <!-- Optional Footer Content (e.g., copyright, contact info) -->
</footer>

<!-- ✅ Ensure Chart.js Loads BEFORE `index.js` ✅ -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script type="module" src="index.js"></script>

</body>
</html>
